name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          unzip -q project.zip
          cd HtmlToApk
          mkdir -p app/src/main/assets
          keytool -J-Dkeystore.pkcs12.legacy -genkeypair -keystore app/src/main/assets/sign.p12 -storetype PKCS12 -storepass android -keypass android -alias h2a -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=HTML to APK"
          gradle :runner:assembleRelease --no-daemon
          cp runner/build/outputs/apk/release/runner-release-unsigned.apk app/src/main/assets/template.apk
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../HTML-to-APK.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: HTML-to-APK.apk
